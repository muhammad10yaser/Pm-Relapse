<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5-Relapse · Muhammad Yaser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-1: #0d1526;
      --bg-2: #101a30;
      --bg-3: #0a1120;
      --left-text: #e8eefc;
      --left-dim: #8a9cbb;
      --left-dim-2: #5a6d8c;

      --purple: #7c5cff;
      --purple-2: #9b7fff;
      --purple-3: #bfaaff;
      --purple-deep: #6244d6;

      --ok: #15803d;
      --warn: #c2680d;
      --err: #c02b2b;
    }

    html, body {
      height: 100%;
      background: var(--bg-1);
      color: var(--left-text);
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      font-size: 17px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(124, 92, 255, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(60, 120, 220, 0.12) 0%, transparent 50%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* ============================================================
       LAYOUT — 55% exploit / 45% payloads
       ============================================================ */
    #layout {
      display: grid;
      grid-template-columns: 55fr 45fr;
      height: 100vh;
    }

    #ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 26px;
      color: var(--left-text);
    }

    .brand h1 {
      font-size: 34px;
      letter-spacing: 6px;
      font-weight: 500;
      color: #a78bfa;
      text-align: center;
      text-shadow: 0 0 24px rgba(167, 139, 250, 0.45);
    }

    .brand .dev {
      font-size: 14px;
      letter-spacing: 3px;
      color: var(--left-dim);
      text-align: center;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .brand .dev span {
      color: #a78bfa;
      font-weight: 700;
    }

    /* ---------- PROGRESS BAR ---------- */
    #bar-wrap {
      width: min(640px, 92%);
      height: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(167, 139, 250, 0.25);
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.4),
        inset 0 0 20px rgba(124, 92, 255, 0.08);
    }

    #bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--purple), var(--purple-2), var(--purple));
      background-size: 200% 100%;
      animation: slide 1.4s linear infinite;
      transition: width 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
      box-shadow: 0 0 20px rgba(124, 92, 255, 0.7);
      border-radius: 12px;
    }

    @keyframes slide {
      0%   { background-position: 0% 0%; }
      100% { background-position: 200% 0%; }
    }

    #status {
      font-size: 17px;
      color: var(--left-dim);
      min-height: 24px;
      text-align: center;
      font-weight: 500;
    }

    #hint {
      font-size: 14px;
      color: var(--left-dim-2);
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.5;
    }

    #hint.ready {
      color: #ffd166;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }

    #console {
      width: min(640px, 92%);
      max-height: 26vh;
      overflow-y: auto;
      padding: 14px 18px;
      font-size: 13px;
      line-height: 1.6;
      color: #7fbf9f;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(167, 139, 250, 0.18);
      border-radius: 10px;
      white-space: pre-wrap;
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    #console::-webkit-scrollbar { width: 8px; }
    #console::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.3);
      border-radius: 4px;
    }

    #credit {
      position: absolute;
      bottom: 20px;
      left: 40px;
      font-size: 13px;
      color: var(--left-dim-2);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #credit span { color: #a78bfa; font-weight: 700; }

    /* ---------- PAYLOAD PANEL ---------- */
    #payloads {
      background: rgba(13, 21, 38, 0.6);
      border-left: 1px solid rgba(167, 139, 250, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--left-text);
    }

    #payloads header {
      padding: 20px 22px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(167, 139, 250, 0.18);
      min-height: 60px;
    }

    #payloads header .title {
      font-size: 16px;
      letter-spacing: 4px;
      color: #a78bfa;
      font-weight: 700;
    }

    #controls-hint {
      padding: 12px 22px;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--left-dim-2);
      border-bottom: 1px solid rgba(167, 139, 250, 0.12);
      font-weight: 500;
      line-height: 1.6;
    }

    #controls-hint b { color: #a78bfa; font-weight: 700; }

    /* ============================================================
       PAYLOAD LIST — 2-column grid
       ============================================================ */
    #list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-content: start;
    }

    #list::-webkit-scrollbar { width: 8px; }
    #list::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.3);
      border-radius: 4px;
    }

    @media (max-width: 900px) {
      #list { grid-template-columns: 1fr; }
    }

    .payload {
      padding: 14px 16px;
      font-size: 14px;
      color: var(--left-text);
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 3px solid transparent;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      min-width: 0;
    }

    .payload .check {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(167, 139, 250, 0.4);
      border-radius: 5px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: transparent;
      background: rgba(255, 255, 255, 0.04);
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .payload .name {
      flex: 1;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .payload .status {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--left-dim-2);
      font-weight: 600;
      flex-shrink: 0;
    }

    .payload.waiting .check {
      border-color: rgba(167, 139, 250, 0.4);
    }

    .payload.selected {
      background-color: rgba(124, 92, 255, 0.14);
      border-left-color: var(--purple);
      color: #fff;
    }

    .payload.selected .check {
      background-color: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }

    .payload.cursor {
      outline: 2px dashed rgba(167, 139, 250, 0.5);
      outline-offset: -4px;
    }

    .payload.sending {
      color: #ffd166;
      border-left-color: var(--warn);
      background-color: rgba(194, 104, 13, 0.12);
    }

    .payload.sending .status { color: var(--warn); }

    .payload.sent {
      color: #4ade80;
      border-left-color: #4ade80;
      opacity: 0.75;
    }

    .payload.sent .check {
      background-color: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }

    .payload.sent .status { color: #4ade80; }

    .payload.failed {
      color: #f87171;
      border-left-color: var(--err);
      background-color: rgba(192, 43, 43, 0.12);
    }

    .payload.failed .status { color: var(--err); }

    #empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--left-dim-2);
      font-size: 14px;
      grid-column: 1 / -1;
    }

    /* ---------- FOOTER ---------- */
    #footer {
      padding: 14px 18px;
      border-top: 1px solid rgba(167, 139, 250, 0.18);
      background: rgba(10, 17, 32, 0.7);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #sendBtn {
      width: 100%;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--purple-deep));
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: box-shadow 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 6px 18px rgba(124, 92, 255, 0.32);
    }

    #sendBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(124, 92, 255, 0.48);
    }

    #sendBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #sendBtn:disabled {
      background: rgba(60, 70, 100, 0.5);
      color: #6b7899;
      cursor: not-allowed;
      box-shadow: none;
    }

    #singleBtn,
    #clearBtn {
      width: 100%;
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      font-family: inherit;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    #singleBtn {
      color: var(--left-text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(167, 139, 250, 0.35);
    }

    #singleBtn:hover:not(:disabled) {
      color: #a78bfa;
      border-color: #a78bfa;
      background: rgba(124, 92, 255, 0.12);
    }

    #singleBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #clearBtn {
      color: #f87171;
      background: rgba(192, 43, 43, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.35);
    }

    #clearBtn:hover:not(:disabled) {
      color: #fca5a5;
      border-color: #f87171;
      background: rgba(192, 43, 43, 0.18);
    }

    #clearBtn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    @media (max-width: 720px) {
      #layout { grid-template-columns: 1fr; grid-template-rows: 55fr 45fr; }
      #payloads { border-left: none; border-top: 1px solid rgba(167, 139, 250, 0.18); }
      .brand h1 { font-size: 26px; letter-spacing: 4px; }
      .brand .dev { font-size: 12px; }
      #credit { position: static; margin-top: 18px; font-size: 12px; }
    }

    @media (min-width: 2560px) {
      html, body { font-size: 20px; }
      .brand h1 { font-size: 42px; }
      #status { font-size: 21px; }
      #hint { font-size: 18px; }
      #console { font-size: 15px; }
      .payload { font-size: 16px; padding: 16px 20px; }
      #sendBtn { font-size: 16px; padding: 16px; }
      #singleBtn, #clearBtn { font-size: 15px; padding: 14px; }
    }
  </style>
</head>
<body>
  <div id="layout">

    <div id="ui">
      <div class="brand">
        <h1>PS5 (7.00 - 13.60) · RELAPSE</h1>
        <div class="dev">developed by <span>Muhammad Yaser</span></div>
      </div>

      <div id="bar-wrap"><div id="bar"></div></div>

      <div id="status">booting…</div>
      <div id="hint">waiting for exploit…</div>

      <div id="console"></div>

      <div id="credit">v1.0 · <span>Muhammad Yaser</span></div>
    </div>

    <div id="payloads">
      <header>
        <span class="title">PAYLOADS</span>
      </header>

      <div id="controls-hint">
        <b>X</b> select · <b>L2</b> run · <b>R1</b> etaHEN · <b>R2</b> clear
      </div>

      <div id="list">
        <div id="empty">loading payloads…</div>
      </div>

      <div id="footer">
        <button id="sendBtn" disabled>SELECT PAYLOADS (L2)</button>
        <button id="singleBtn" disabled>R1 · ETAHEN ONLY</button>
        <button id="clearBtn" disabled>R2 · CLEAR</button>
      </div>
    </div>

  </div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>

  <script type="module" src="./src/site.js"></script>

  <!-- loading bar hook -->
  <script>
    (function () {
      const bar    = document.getElementById('bar');
      const status = document.getElementById('status');
      const hint   = document.getElementById('hint');

      function setProgress(p, label) {
        bar.style.width = Math.max(0, Math.min(100, p)) + '%';
        if (label) status.textContent = label;
      }

      const STAGE_MAP = [
        [/webkit/i,               8,   'webkit exploit'],
        [/ARW/i,                  20,  'arbitrary read/write ready'],
        [/WebKit base/i,          25,  'webkit base leaked'],
        [/Starting kernel/i,      30,  'starting kernel exploit'],
        [/base 0x/i,              40,  'kernel base leaked'],
        [/read and write ready/i, 55,  'kernel rw ready'],
        [/fast read and write/i,  65,  'fast kernel rw ready'],
        [/privileges ready/i,     75,  'root + sandbox escape'],
        [/kexp/i,                 85,  'loading kernel payload'],
        [/elfldr/i,               92,  'elfldr is listening'],
        [/payloads loaded/i,      100, 'ready — press L2'],
      ];

      const origWrite = window.writeLog;
      window.writeLog = function (message, type) {
        if (typeof origWrite === 'function') origWrite(message, type);
        const text = String(message);

        for (const [re, pct, label] of STAGE_MAP) {
          if (re.test(text)) {
            setProgress(pct, label);
            if (pct === 100) hint.classList.add('ready');
            break;
          }
        }

        if (type === 'error') {
          bar.style.background = '#dc2626';
          status.textContent = 'failed: ' + text;
        }
      };

      window.__markReady = function (alreadyJailbroken) {
        setProgress(100, alreadyJailbroken
          ? 'jailbreak already active — payload sender ready'
          : 'ready — press L2');
        hint.classList.add('ready');
        hint.innerHTML = '<b>X</b> select &nbsp;·&nbsp; <b>L2</b> run selected &nbsp;·&nbsp; <b>R1</b> etaHEN only &nbsp;·&nbsp; <b>R2</b> clear';

        const sendBtn   = document.getElementById('sendBtn');
        const singleBtn = document.getElementById('singleBtn');
        const clearBtn  = document.getElementById('clearBtn');
        if (sendBtn)   { sendBtn.disabled = false; }
        if (singleBtn) { singleBtn.disabled = false; }
        if (clearBtn)  { clearBtn.disabled = false; }
      };

      window.__setHint = function (txt) { hint.textContent = txt; };

      /* Already-jailbroken fast path */
      try {
        const wasJailbroken = localStorage.getItem('ps5-jailbroken') === '1';
        if (wasJailbroken) {
          window.__alreadyJailbroken = true;
          setProgress(60, 'jailbreak detected — waiting for elfldr');
          hint.textContent = 'waiting for elfldr on port 9021…';
        }
      } catch (e) {}
    })();
  </script>

  <!-- payload status panel -->
  <script>
    (function () {
      const listEl    = document.getElementById('list');
      const sendBtn   = document.getElementById('sendBtn');
      const singleBtn = document.getElementById('singleBtn');
      const clearBtn  = document.getElementById('clearBtn');

      let ALL_PAYLOADS = [];
      const SINGLE_PAYLOAD = 'etaHEN.elf';

      let selected = new Set();
      let cursor   = 0;
      let sending  = false;

      function setRowState(name, state) {
        const el = document.querySelector(`.payload[data-name="${CSS.escape(name)}"]`);
        if (!el) return;
        el.classList.remove('waiting', 'sending', 'sent', 'failed');
        el.classList.add(state);

        const statusEl = el.querySelector('.status');
        if (statusEl) {
          statusEl.textContent =
            state === 'sending' ? 'sending' :
            state === 'sent'    ? 'loaded'  :
            state === 'failed'  ? 'failed'  :
                                  'waiting';
        }
      }

      function resetRows() {
        document.querySelectorAll('.payload').forEach((el) => {
          el.classList.remove('sending', 'sent', 'failed');
          el.classList.add('waiting');
          const statusEl = el.querySelector('.status');
          if (statusEl) statusEl.textContent = 'waiting';
        });
      }

      function applySelectionVisuals() {
        document.querySelectorAll('.payload').forEach((el) => {
          const isSel = selected.has(el.dataset.name);
          const isCursor = Number(el.dataset.index) === cursor;
          el.classList.toggle('selected', isSel);
          el.classList.toggle('cursor', isCursor);
        });
        updateButtons();
      }

      function updateButtons() {
        if (sending) {
          sendBtn.textContent = 'RUNNING…';
          sendBtn.disabled = true;
          singleBtn.disabled = true;
          clearBtn.disabled = true;
          return;
        }
        const n = selected.size;
        sendBtn.textContent = n === 0
          ? 'SELECT PAYLOADS (L2)'
          : n === 1
            ? 'RUN 1 PAYLOAD (L2)'
            : `RUN ${n} PAYLOADS (L2)`;
        sendBtn.disabled = n === 0 || !window.__elfldrReady;
        singleBtn.disabled = !window.__elfldrReady;
        clearBtn.disabled = n === 0;
      }

      function toggleSelect(name) {
        if (selected.has(name)) selected.delete(name);
        else selected.add(name);
        applySelectionVisuals();
      }

      function clearSelections() {
        if (sending) return;
        if (selected.size === 0) {
          window.writeLog && window.writeLog('nothing to clear', 'info');
          return;
        }
        const n = selected.size;
        selected.clear();
        applySelectionVisuals();
        window.writeLog && window.writeLog(`cleared ${n} selection${n > 1 ? 's' : ''} (R2)`, 'info');
      }

      function columnCount() {
        return window.innerWidth < 900 ? 1 : 2;
      }

      function moveCursor(dx, dy) {
        const rows = document.querySelectorAll('.payload');
        if (!rows.length) return;

        if (dy !== 0) {
          const cols = columnCount();
          cursor = (cursor + dy * cols + rows.length * 10) % rows.length;
        } else if (dx !== 0) {
          cursor = (cursor + dx + rows.length) % rows.length;
        }

        const el = rows[cursor];
        if (el) el.scrollIntoView({ block: 'nearest' });
        applySelectionVisuals();
      }

      /* X — always acts on the row under the cursor, regardless of mouse */
      function xAction() {
        const rows = document.querySelectorAll('.payload');
        if (!rows.length) return;
        toggleSelect(rows[cursor].dataset.name);
      }

      function l2Action() {
        if (sending) return;
        if (!window.__elfldrReady) {
          window.writeLog && window.writeLog('elfldr not ready', 'error');
          return;
        }
        if (selected.size === 0) {
          window.writeLog && window.writeLog('no payloads selected (press X)', 'error');
          return;
        }

        sending = true;
        updateButtons();
        resetRows();

        const queue = ALL_PAYLOADS.filter((n) => selected.has(n));

        window.writeLog && window.writeLog(
          `running ${queue.length} selected payload${queue.length > 1 ? 's' : ''}`,
          'info'
        );

        (async () => {
          for (let i = 0; i < queue.length; i++) {
            const name = queue[i];
            setRowState(name, 'sending');
            window.writeLog && window.writeLog(`[${i + 1}/${queue.length}] ${name}`, 'info');

            try {
              await window.__sendPayload(name);
              setRowState(name, 'sent');
              window.writeLog && window.writeLog(`${name} sent`, 'info');

              /* Auto-deselect on success */
              if (selected.has(name)) selected.delete(name);
            } catch (err) {
              setRowState(name, 'failed');
              window.writeLog && window.writeLog(`${name} failed: ${err.message}`, 'error');
            }

            if (i < queue.length - 1) {
              await new Promise((r) => setTimeout(r, 1500));
            }
          }

          sending = false;
          updateButtons();
          window.writeLog && window.writeLog('done', 'info');
        })();
      }

      async function runSingle() {
        if (sending) return;
        if (!window.__elfldrReady) {
          window.writeLog && window.writeLog('elfldr not ready', 'error');
          return;
        }

        sending = true;
        updateButtons();

        setRowState(SINGLE_PAYLOAD, 'sending');
        window.writeLog && window.writeLog(`running ${SINGLE_PAYLOAD} only`, 'info');

        try {
          await window.__sendPayload(SINGLE_PAYLOAD);
          setRowState(SINGLE_PAYLOAD, 'sent');
          window.writeLog && window.writeLog(`${SINGLE_PAYLOAD} sent`, 'info');

          /* Auto-deselect if etaHEN was selected */
          if (selected.has(SINGLE_PAYLOAD)) selected.delete(SINGLE_PAYLOAD);
        } catch (err) {
          setRowState(SINGLE_PAYLOAD, 'failed');
          window.writeLog && window.writeLog(`${SINGLE_PAYLOAD} failed: ${err.message}`, 'error');
        }

        sending = false;
        updateButtons();
        window.writeLog && window.writeLog('done', 'info');
      }

      async function loadPayloadsFromJSON() {
        try {
          const res = await fetch('./payloads.json', { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (!Array.isArray(data)) throw new Error('invalid payloads.json');
          return data
            .filter((p) => typeof p.name === 'string' && p.name.toLowerCase().endsWith('.elf'))
            .map((p) => p.name);
        } catch (err) {
          window.writeLog && window.writeLog('failed to load payloads.json: ' + err.message, 'error');
          return [];
        }
      }

      function renderRows(names) {
        listEl.innerHTML = '';

        if (!names.length) {
          listEl.innerHTML = '<div id="empty">no .elf payloads found</div>';
          return;
        }

        for (const name of names) {
          const row = document.createElement('div');
          row.className = 'payload waiting';
          row.dataset.name = name;
          row.innerHTML = `
            <span class="check">✓</span>
            <span class="name">${name}</span>
            <span class="status">waiting</span>
          `;
          listEl.appendChild(row);
        }

        document.querySelectorAll('.payload').forEach((el, i) => {
          el.dataset.index = i;
        });
        cursor = 0;
        applySelectionVisuals();
      }

      sendBtn.addEventListener('click', l2Action);
      singleBtn.addEventListener('click', runSingle);
      clearBtn.addEventListener('click', clearSelections);

      listEl.addEventListener('click', (e) => {
        const row = e.target.closest('.payload');
        if (!row) return;
        cursor = Number(row.dataset.index) || 0;
        toggleSelect(row.dataset.name);
      });

      /* ---------- Robust PS5 controller mapping ---------- */
      function getPressedButton(e) {
        if (e.key === 'Enter' || e.key === 'x' || e.key === 'X') return 'X';
        if (e.key === 'F5'  || e.key === 'L1') return 'L1';
        if (e.key === 'F6'  || e.key === 'R1') return 'R1';
        if (e.key === 'F7'  || e.key === 'L2') return 'L2';
        if (e.key === 'F8'  || e.key === 'R2') return 'R2';

        const kc = e.keyCode || e.which;
        if (kc) {
          switch (kc) {
            case 13:  return 'X';
            case 116: return 'L1';
            case 117: return 'R1';
            case 118: return 'L2';
            case 119: return 'R2';
            case 37:  return 'LEFT';
            case 38:  return 'UP';
            case 39:  return 'RIGHT';
            case 40:  return 'DOWN';
          }
        }

        if (e.key === 'ArrowUp')    return 'UP';
        if (e.key === 'ArrowDown')  return 'DOWN';
        if (e.key === 'ArrowLeft')  return 'LEFT';
        if (e.key === 'ArrowRight') return 'RIGHT';

        return null;
      }

      window.addEventListener('keydown', (e) => {
        const btn = getPressedButton(e);
        if (!btn) return;

        switch (btn) {
          case 'X':      e.preventDefault(); xAction();          break;
          case 'L2':     e.preventDefault(); l2Action();         break;
          case 'R1':     e.preventDefault(); runSingle();        break;
          case 'R2':     e.preventDefault(); clearSelections();  break;
          case 'UP':     e.preventDefault(); moveCursor(0, -1);  break;
          case 'DOWN':   e.preventDefault(); moveCursor(0, 1);   break;
          case 'LEFT':   e.preventDefault(); moveCursor(-1, 0);  break;
          case 'RIGHT':  e.preventDefault(); moveCursor(1, 0);   break;
        }
      }, true);

      window.__elfldrUI = updateButtons;

      (async () => {
        ALL_PAYLOADS = await loadPayloadsFromJSON();
        renderRows(ALL_PAYLOADS);
      })();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('[SW] Registered:', reg.scope))
          .catch((err) => console.error('[SW] Registration failed:', err));
      });
    }
  </script>
</body>
</html>
